name: Setup GitHub Credentials
description: Sets up git config to use token for GitHub URLs (on hpc-batch)

inputs:
  github_token:
    description: GitHub token to use
    required: true

runs:
  using: composite
  steps:
    - name: Set github credentials
      env:
        TOKEN: ${{ inputs.github_token }}
      run: |
        sed -i 's#ssh://git@github.com:#https://github.com/#g' pyproject.toml
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"
        printf '%s' "$TOKEN" | helper_exec 'git config --global url."https://$(cat)@github.com/".insteadOf "https://github.com/"'
      shell: bash
