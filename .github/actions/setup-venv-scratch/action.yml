name: Point .venv at $SCRATCH
description: Create the venv in $SCRATCH and symlink .venv to it

runs:
  using: composite
  steps:
    - name: Point .venv at $SCRATCH
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"

        scratch=$(helper_getVar SCRATCH)
        if [ -z "$scratch" ]; then
          echo "::warning::Could not resolve \$SCRATCH via hpc-batch - leaving .venv on this runner's own disk."
          exit 0
        fi

        venv_target="$scratch/tactus/github-runner/$GITHUB_RUN_ID/.venv"
        # Real venv (poetry rejects an empty .venv); system site-packages for ecflow.
        helper_exec "rm -rf '$venv_target'"
        helper_ml_exec "python3 -m venv --system-site-packages '$venv_target' && '$venv_target/bin/python' -c 'import ecflow'"

        rm -rf .venv
        ln -s "$venv_target" .venv
